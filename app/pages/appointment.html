<main class="main">

  <section class="appointment">
    <div class="container">
      <h2 class="appointment__title title-accent">book an appointment</h2>
      <div class="appointment__box">
        <form class="appointment__form" action="">
          <p class="appointment__form-title">contact information</p>
           <p class="appointment__form-text">Fill in your contact details</p>
          <label for="first name"></label>
           <input class="appointment__input" id="first name" type="text" placeholder="First name">
            <label for="last name"></label>
           <input class="appointment__input" id="last name" type="text" placeholder="Last name">
            <label for="email"></label>
           <input class="appointment__input" id="email" type="email" placeholder="Email">
            <label for="mobile"></label>
           <input class="appointment__input" id="mobile" type="text" placeholder="Mobile">
           <button class="appointment__btn link-accent" type="submit">send</button>
        </form>
        <picture>
          <source srcset="images/appointment.avif" type="image/avif">
          <source srcset="images/appointment.webp" type="image/webp">
          <img class="appointment__img" src="images/appointment.jpg" width="540" height="869" alt="collection dress">
        </picture>
      </div>
    </div>
  </section>
</main>
