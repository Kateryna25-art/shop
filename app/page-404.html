<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxurious Bridal Haven</title>
  <link rel="stylesheet" href="css/style.min.css">
  
</head>

<body>

  <div class="wrapper">
<div class="promo">
  <div class="container">
    <p class="promo-text">
      save 10% off when you <a href="#">sign up</a>
    </p>
  </div>
</div>
<header class="header">
  <div class="container">
    <div class="header__inner d-flex">
      <button class="header__btn" type="button" aria-label="open menu">
        <svg width="30" height="19">
          <use xlink:href="images/sprite.svg#mobile-btn"></use>
        </svg>
      </button>
      <div class="header__logo">
        <a href="#" class="logo">
          <img class="logo__img" src="images/logo.svg" width="239" height="28" alt="logo">
        </a>
      </div>
      <nav class="menu">
        <ul class="header__lang d-flex">
          <li class="header__lang-item header__lang-item--active">
            <a href="#" class="header__lang-link">en</a>/
          </li>
          <li class="header__lang-item">
            <a href="#" class="header__lang-link">ua</a>
          </li>
        </ul>
        <ul class="menu__list d-flex">
          <li class="menu__item"><a class="menu__item-link" href="#">catalog</a>
          </li>
          <li class="menu__item"><a class="menu__item-link" href="#">collections</a>
          </li>
          <li class="menu__item"><a class="menu__item-link" href="#">about</a>
          </li>
          <li class="menu__item"><a class="menu__item-link" href="#">book an
              appointment</a>
          </li>
          <li class="menu__item"><a class="menu__item-link" href="#">contact</a>
          </li>
        </ul>
      </nav>
      <ul class="header__actions d-flex">
        <li class="header__actions-item">
          <a class="header__actions-link" href="#" aria-label="user account">
            <svg width="24" height="24">
              <use xlink:href="images/sprite.svg#user"></use>
            </svg>
          </a>
        </li>
        <li class="header__actions-item">
          <a class="header__actions-link" href="#" aria-label="wishlist">
            <svg width="24" height="22">
              <use xlink:href="images/sprite.svg#wishlist"></use>
            </svg>
          </a>
        </li>
        <li class="header__actions-item">
          <a class="header__actions-link" href="#" aria-label="shopping bag">
            <svg width="24" height="24">
              <use xlink:href="images/sprite.svg#shopping-bag"></use>
            </svg>
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>

<main class="main">
  <div class="page-404__container">
    <div class="page-404__inner">
      <picture>
        <source srcset="images/img-404-1.avif" type="image/avif">
        <source srcset="images/img-404-1.webp" type="image/webp">
        <img src="images/img-404-1.jpg" width="200" height="249" alt="Alt text">
      </picture>
      <div class="page-404__content">
        <p class="page-404__title">( 404 )</p>
        <a class="page-404__link" href="#">
          <span>return to the main page</span>
          <img src="images/img-404-decor.svg" width="90" height="90" alt="decor arrow">
        </a>
      </div>
      <picture>
        <source srcset="images/img-404-2.avif" type="image/avif">
        <source srcset="images/img-404-2.webp" type="image/webp">
        <img src="images/img-404-2.jpg" width="562" height="638" alt="Alt text">
      </picture>
    </div>
  </div>
  <div class="moving">
    <p class="moving__text">
      <span>page not found</span>
       <span>page not found</span>
      <span>page not found</span>
       <span>page not found</span>
      <span>page not found</span>
      <span>page not found</span>
    <span>page not found</span>
    </p>
  </div>
</main>
</div>

<script src="js/main.min.js"></script>
</body>

</html>
