<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxurious Bridal Haven</title>
    <link rel="stylesheet" href="css/style.min.css">
</head>
<body>

    <div class="wrapper">
        <header class="header">
         <div class="container">
            <div class="header__inner">
                <div class="header__logo">
               <a href="#" class="logo" aria-label="home link">
                <img class="logo__img" src="images/logo.svg" alt="logo" >
            </a>
            </div>
            <ul class="header__lang">
                <li class="header__lang-item header__lang--active">
           <a href="#" class="header__lang-link" aria-label="language link">EN</a>/
                </li>
                 <li class="header__lang-item">
           <a href="#" class="header__lang-link" aria-label="language link">UA</a>
                </li>
            </ul>
            <nav class="menu">
             <ul class="menu__list">
                <li class="menu__item"><a class="menu__item-link" href="#" aria-label="catalog">CATALOG</a>
                </li>
                <li class="menu__item"><a class="menu__item-link" href="#" aria-label="collections">COLLECTIONS</a>
                </li>
                <li class="menu__item"><a class="menu__item-link" href="#" aria-label="about">ABOUT</a>
                </li>
                <li class="menu__item"><a class="menu__item-link" href="#" aria-label="book appointment">BOOK AN APPOINTMENT</a>
                </li>
                <li class="menu__item"><a class="menu__item-link" href="#" aria-label="contact">CONTACT</a>
                </li>
             </ul>
            </nav>
            <ul class="header__actions">
                <li class="header__actions-item">
                    <a class="header__actions-link" href="#" aria-label="user account">
                     <svg width="24" height="24">
                       <use xlink:href="images/sprite.svg#user"></use>
                     </svg>
                    </a>
                </li>
                <li class="header__actions-item">
                    <a class="header__actions-link" href="#" aria-label="wishlist">
                     <svg width="24" height="22">
                       <use xlink:href="images/sprite.svg#wishlist"></use>
                     </svg>
                    </a>
                </li>
                <li class="header__actions-item">
                    <a class="header__actions-link" href="#" aria-label="shopping bag">
                   <svg width="24" height="24">
                       <use xlink:href="images/sprite.svg#shopping-bag"></use>
                     </svg>
                    </a>
                </li>
            </ul>
            </div>
         </div>
        </header>
