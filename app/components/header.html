<header class="header">
  <div class="container">
    <div class="header__inner d-flex">
      <button class="header__btn" type="button" aria-label="open menu">
        <svg width="30" height="19">
          <use xlink:href="images/sprite.svg#mobile-btn"></use>
        </svg>
      </button>
      <div class="header__logo">
        <a href="#" class="logo">
          <img class="logo__img" src="images/logo.svg" width="239" height="28" alt="logo">
        </a>
      </div>
      <nav class="menu">
        <ul class="header__lang d-flex">
          <li class="header__lang-item header__lang-item--active">
            <a href="#" class="header__lang-link">en</a>/
          </li>
          <li class="header__lang-item">
            <a href="#" class="header__lang-link">ua</a>
          </li>
        </ul>
        <ul class="menu__list d-flex">
          <li class="menu__item"><a class="menu__item-link" href="#">catalog</a>
          </li>
          <li class="menu__item"><a class="menu__item-link" href="#">collections</a>
          </li>
          <li class="menu__item"><a class="menu__item-link" href="#">about</a>
          </li>
          <li class="menu__item"><a class="menu__item-link" href="#">book an
              appointment</a>
          </li>
          <li class="menu__item"><a class="menu__item-link" href="#">contact</a>
          </li>
        </ul>
      </nav>
      <ul class="header__actions d-flex">
        <li class="header__actions-item">
          <a class="header__actions-link" href="#" aria-label="user account">
            <svg width="24" height="24">
              <use xlink:href="images/sprite.svg#user"></use>
            </svg>
          </a>
        </li>
        <li class="header__actions-item">
          <a class="header__actions-link" href="#" aria-label="wishlist">
            <svg width="24" height="22">
              <use xlink:href="images/sprite.svg#wishlist"></use>
            </svg>
          </a>
        </li>
        <li class="header__actions-item">
          <a class="header__actions-link open-modal" href="#" aria-label="shopping bag">
            <svg width="24" height="24">
              <use xlink:href="images/sprite.svg#shopping-bag"></use>
            </svg>
          </a>
        </li>
      </ul>
    </div>
    <div class="modal" aria-hidden="true">
      <div class="modal__overlay"></div> 
      <div class="modal__content" role="dialog" aria-modal="true">
        <div class="checkout__details-items">
          <div class="checkout__details-itemsline">
            <p class="checkout__details-quantity">2 items in bag</p>
            <button class=" checkout__details-del close-modal" type="button" aria-label="close the modal window">
              <svg width="18" height="18">
                <use xlink:href="images/sprite.svg#checkout-del"></use>
              </svg>
            </button>
          </div>
          <div class="checkout__item">
            <picture>
              <source srcset="images/order-1.avif" type="image/avif">
              <source srcset="images/order-1.webp" type="image/webp">
              <img class="checkout__item-img" width="139" height="182" src="images/order-1.jpg"
                alt="wedding dress naomi" loading="lazy">
            </picture>
            <div class="checkout__item-box">
              <p class="checkout__item-title">naomi</p>
              <dl class="checkout__item-list">
                <div class="checkout__item-listbox">
                  <dt class="checkout__item-term">size:</dt>
                  <dd class="checkout__item-difinition">s</dd>
                </div>
                <div class="checkout__item-listbox">
                  <dt class="checkout__item-term">color:</dt>
                  <dd class="checkout__item-difininion">ivory</dd>
                </div>
                <div class="checkout__item-listbox">
                  <dt class="checkout__item-term">Item subtotal:</dt>
                  <dd class="checkout__item-difininion">€ 2,600</dd>
                </div>
              </dl>
              <button class="checkout__item-del" aria-label="remove naomi dress from bag">
                <svg width="16" height="20">
                  <use xlink:href="images/sprite.svg#item-del"></use>
                </svg>
              </button>
            </div>
          </div>
          <div class="checkout__item">
            <picture>
              <source srcset="images/order-2.avif" type="image/avif">
              <source srcset="images/order-2.webp" type="image/webp">
              <img class="checkout__item-img" width="139" height="182" src="images/order-2.jpg"
                alt="wedding shoes sabine" loading="lazy">
            </picture>
            <div class="checkout__item-box">
              <p class="checkout__item-title">sabine</p>
              <dl class="checkout__item-list">
                <div class="checkout__item-listbox">
                  <dt class="checkout__item-term">size:</dt>
                  <dd class="checkout__item-difininion">38</dd>
                </div>
                <div class="checkout__item-listbox">
                  <dt class="checkout__item-term">color:</dt>
                  <dd class="checkout__item-difininion">ivory</dd>
                </div>
                <div class="checkout__item-listbox">
                  <dt class="checkout__item-term">Item subtotal:</dt>
                  <dd class="checkout__item-difininion">€ 200</dd>
                </div>
              </dl>
              <button class="checkout__item-del" aria-label="remove sabine shoes from bag">
                <svg width="16" height="20">
                  <use xlink:href="images/sprite.svg#item-del"></use>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="order">
          <dl class="order__list">
            <div class="order__list-box">
              <dt class="order__list-term">Subtotal:</dt>
              <dd class="order__list-difinition">€2, 800</dd>
            </div>
            <div class="order__list-box">
              <dt class="order__list-term">Shipping:</dt>
              <dd class="order__list-difinition">free</dd>
            </div>
            <div class="order__list-box">
              <dt class="order__list-term">Total:</dt>
              <dd class="order__list-difinition">€ 2,800</dd>
            </div>
          </dl>
          <div class="order__links">
            <a class="order__link" href="#">keep shopping</a>
            <a class="order__link-now" href="#">buy it now</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
